<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" fill="none">
  <rect width="1400" height="980" fill="#0b1220"/>
  <rect x="28" y="28" width="1344" height="924" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/>

  <text x="56" y="78" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">
    Sample SELL Trigger Setup
  </text>
  <text x="56" y="112" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="18">
    Classic mode: H4 trend + H1 trend + M5 entry + M1 confirmation
  </text>

  <rect x="54" y="146" width="1292" height="64" rx="14" fill="#1e293b" stroke="#475569"/>
  <text x="78" y="186" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">
    This is an illustrative example only. A live trigger still depends on session, spread, open slots, cooldown, live reference price, and bridge checks.
  </text>

  <g>
    <rect x="54" y="238" width="400" height="278" rx="18" fill="#0f172a" stroke="#334155"/>
    <text x="78" y="276" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">H4 Bias</text>
    <text x="78" y="304" fill="#f87171" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">SELL</text>
    <line x1="86" y1="474" x2="420" y2="474" stroke="#334155" stroke-width="2"/>
    <line x1="86" y1="340" x2="86" y2="474" stroke="#334155" stroke-width="2"/>
    <polyline points="96,356 132,372 170,366 208,396 246,390 284,422 322,418 360,448 402,444"
      stroke="#f87171" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="96" y1="334" x2="402" y2="426" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <text x="78" y="500" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="16">
      Price below EMA50, making lower highs and lower lows
    </text>
  </g>

  <g>
    <rect x="498" y="238" width="400" height="278" rx="18" fill="#0f172a" stroke="#334155"/>
    <text x="522" y="276" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">H1 Bias</text>
    <text x="522" y="304" fill="#f87171" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">SELL</text>
    <line x1="530" y1="474" x2="864" y2="474" stroke="#334155" stroke-width="2"/>
    <line x1="530" y1="340" x2="530" y2="474" stroke="#334155" stroke-width="2"/>
    <polyline points="540,360 576,382 614,376 652,404 690,398 728,426 766,420 804,446 846,442"
      stroke="#f87171" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="540" y1="344" x2="846" y2="428" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <text x="522" y="500" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="16">
      H1 agrees with H4, so trend stack can pass for SELL
    </text>
  </g>

  <g>
    <rect x="942" y="238" width="404" height="278" rx="18" fill="#0f172a" stroke="#334155"/>
    <text x="966" y="276" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">M5 Entry</text>
    <text x="966" y="304" fill="#f87171" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">SELL</text>
    <line x1="974" y1="474" x2="1312" y2="474" stroke="#334155" stroke-width="2"/>
    <line x1="974" y1="340" x2="974" y2="474" stroke="#334155" stroke-width="2"/>
    <line x1="992" y1="386" x2="1296" y2="386" stroke="#fbbf24" stroke-width="4" stroke-dasharray="10 8"/>
    <line x1="992" y1="364" x2="1296" y2="364" stroke="#60a5fa" stroke-width="3" stroke-dasharray="7 7"/>
    <line x1="992" y1="454" x2="1296" y2="454" stroke="#34d399" stroke-width="3" stroke-dasharray="7 7"/>
    <rect x="1010" y="372" width="16" height="44" fill="#e2e8f0"/>
    <line x1="1018" y1="352" x2="1018" y2="432" stroke="#e2e8f0" stroke-width="4"/>
    <rect x="1052" y="388" width="16" height="40" fill="#f87171"/>
    <line x1="1060" y1="376" x2="1060" y2="442" stroke="#f87171" stroke-width="4"/>
    <rect x="1094" y="402" width="16" height="32" fill="#f87171"/>
    <line x1="1102" y1="392" x2="1102" y2="450" stroke="#f87171" stroke-width="4"/>
    <rect x="1136" y="414" width="16" height="28" fill="#f87171"/>
    <line x1="1144" y1="406" x2="1144" y2="456" stroke="#f87171" stroke-width="4"/>
    <rect x="1178" y="424" width="16" height="24" fill="#f87171"/>
    <line x1="1186" y1="418" x2="1186" y2="460" stroke="#f87171" stroke-width="4"/>
    <rect x="1220" y="432" width="16" height="20" fill="#f87171"/>
    <line x1="1228" y1="426" x2="1228" y2="464" stroke="#f87171" stroke-width="4"/>
    <text x="966" y="500" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="16">
      Rejection at EMA50 / resistance, then bearish continuation
    </text>
  </g>

  <g>
    <rect x="54" y="548" width="400" height="182" rx="18" fill="#0f172a" stroke="#334155"/>
    <text x="78" y="586" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">M5 Re-entry Bias</text>
    <text x="78" y="620" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace" font-size="18">Last 4 closed M5 candles: bearish, bearish, bearish, bearish</text>
    <text x="78" y="654" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">
      PASS auto_reentry_m5_bias
    </text>
    <text x="78" y="686" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="16">
      Relaxed mode: need at least 3 of 4 bearish and net move down
    </text>
  </g>

  <g>
    <rect x="498" y="548" width="400" height="182" rx="18" fill="#0f172a" stroke="#334155"/>
    <text x="522" y="586" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">M1 Confirmation</text>
    <text x="522" y="620" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="18">
      Latest closed M1 candle is bearish and below EMA50
    </text>
    <text x="522" y="654" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">
      PASS auto_reentry_m1_confirm
    </text>
    <text x="522" y="686" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="16">
      M1 signal must also be SELL
    </text>
  </g>

  <g>
    <rect x="942" y="548" width="404" height="182" rx="18" fill="#0f172a" stroke="#334155"/>
    <text x="966" y="586" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Signal Quality</text>
    <text x="966" y="620" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="18">Confidence: 78%   Win rate: 68%   Strength: STRONG</text>
    <text x="966" y="654" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="18">Noise: LOW   Side filter: SELL allowed</text>
    <text x="966" y="688" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">
      PASS confidence, win rate, strength, noise
    </text>
  </g>

  <g>
    <rect x="54" y="760" width="1292" height="156" rx="18" fill="#111827" stroke="#334155"/>
    <text x="78" y="804" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Assumed passing checks for an actual trigger</text>
    <text x="78" y="840" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="18">
      open slots available | no existing open trade on this symbol | cooldown ready | broker session open | session gate open
    </text>
    <text x="78" y="872" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="18">
      live reference price available | valid SL/TP direction | positive SL/TP distances | min RR passed | spread guard passed
    </text>
    <text x="78" y="904" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">
      Result: eligible SELL setup if your current settings match or are looser than these values
    </text>
  </g>
</svg>
